[project]
name = "role-radar"
version = "0.1.0"
description = "Ping — New roles. Less noise. Config-driven job discovery with explicit source coverage."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "aiofiles>=23.0.0",
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.12.0",
    "colorama>=0.4.6",
    "colorlog>=6.0.0",
    "docx2pdf>=0.1.8",
    "docxtpl>=0.20.2",
    "fastapi>=0.128.0",
    "google-adk>=1.18.0",
    "google-auth>=2.0.0,<3.0.0",
    "google-genai>=0.7.0",
    "gspread>=6.0.0,<7.0.0",
    "html5lib>=1.1",
    "langchain>=1.2.0",
    "langchain-azure-ai>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.5",
    "langchain-google-genai>=4.1.2",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.5",
    "litellm>=1.95.0",
    "lxml>=4.9.0",
    "nest-asyncio>=1.5.0",
    "openpyxl>=3.1.0,<4.0.0",
    "pandas>=2.0.0",
    "playwright==1.57.0",
    "polars>=1.36.1",
    "pydantic>=2.12.5",
    "python-docx>=0.8.11",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "supabase>=2.0.0,<3.0.0",
    "tavily-python>=0.3.0",
    "tqdm>=4.65.0",
    "typing-extensions>=4.0.0",
    "uvicorn[standard]>=0.40.0",
    "websockets>=11.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "ipykernel>=7.1.0",
    "ipython>=9.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
addopts = ["-m", "not private_evidence"]
markers = [
    "private_evidence: requires locally retained private operational evidence that is intentionally excluded from the public repository",
]
