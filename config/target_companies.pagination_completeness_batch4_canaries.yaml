# Explicit opt-in Batch 4 canary. Normal Job Radar execution loads
# config/target_companies.yaml and cannot load this file implicitly.
# This candidate does not change SGS's production source limits.
target_companies:
  - name: SGS
    platform: smartrecruiters
    slug: SGS
    endpoint_variant: companies_postings_v1
    careers_url: https://www.sgs.com/en/careers-at-sgs
    endpoint_url: https://api.smartrecruiters.com/v1/companies/SGS/postings
    identity_regex: ^SGS$
    allowed_apply_hosts: [jobs.smartrecruiters.com]
    page_size: 100
    max_pages: 50
    max_jobs: 5000
    max_response_bytes: 3000000
    selective_detail_enrichment: false
