decision_rules:
  - A first-party corporate careers page must bind the exact Workday tenant, site, hostname, apply hostname, employer, and logical scope.
  - A full-board link or a first-party full-search surface with consistent Workday apply URLs can support a candidate contract.
  - An individual posting alone does not prove the full recruiting board or its absence-authoritative scope.
  - Tenant-name similarity, CXS reachability, third-party listings, and separate unbound careers and ATS URLs carry no identity authority.
  - READY_FOR_CANARY is not RECOVERED; only a later independently authorized PASS_COMPLETE canary may support activation.

