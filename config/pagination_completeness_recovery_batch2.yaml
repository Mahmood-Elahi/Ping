inventory_accounting_contract:
  equation: provider_inventory = normalized_jobs + protected_unreadable_identities + rejected_records + known_duplicate_representations
  required_fields:
    - raw_items
    - unique_provider_ids
    - canonical_urls
    - duplicate_ids
    - duplicate_urls
    - rejections
    - unreadables
    - filtered_or_retention_excluded_observations
  silent_loss_allowed: false

mutation_contract:
  outcomes:
    positive_discoveries_retained: true
    scan_complete: false
    absence_authorized: false
  triggers:
    - total_change
    - page_shift
    - duplicate_boundary_row
    - repeated_or_rollback_cursor
    - disappearing_row
    - insertion_shift
    - unproven_partition_overlap

pass_complete_gates:
  - canonical_employer_identity_validated
  - provider_source_identity_validated
  - complete_provider_inventory
  - terminal_evidence_valid
  - hidden_continuation_absent
  - collection_mutation_absent
  - safety_limit_absent
  - request_budget_respected
  - inventory_fully_accounted
  - unreadable_stable_ids_protected
  - required_stable_ids_unique
  - required_canonical_urls_unique
  - apply_url_contract_valid
  - normalized_rows_attributable_to_company_and_source_scope
  - central_finalizer_authoritative
  - contradictory_diagnostics_absent

