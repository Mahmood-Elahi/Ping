shared_repairs:
  implemented: []
  rationale: >-
    No provider-supported immutable snapshot, complete exact partition set, or
    alternate authoritative inventory is present in deterministic Job Radar
    evidence for these production scopes. Relaxing overlap, repeated-page,
    short-page, empty-page, total-drift, or browser-exhaustion semantics would
    authorize false absence.
  rejected:
    - family: oracle_recruiting
      affects: [JPMorgan Chase, Emerson, Honeywell, Oracle, Fortinet]
      proposal: overlap, shortfall, or total-count tolerance
      reason: offset movement remains observable mutation; sibling tolerance is not an immutable provider contract
    - family: eightfold_pcsx
      affects: [Microsoft, Qualcomm, Micron, Eaton, GlobalFoundries]
      proposal: watermark, repeated page, overlap, or arbitrary empty page as terminal
      reason: these are incremental positive-discovery mechanics, not absence authority
    - family: sap_successfactors
      affects: [CPKC, Scotiabank, Bombardier]
      proposal: accept terminal total after overlap or treat repeated page as EOF
      reason: terminal evidence cannot supersede contradictory traversal evidence
    - family: static_or_browser
      affects: [Goldman Sachs, Stantec, Espressif Systems, ecobee]
      proposal: short page, render exhaustion, or sitemap presence as completeness
      reason: each source lacks an exact active-inventory terminal contract for its configured scope

provider_tracks:
  oracle:
    result: no_safe_family_wide_improvement
    exact_variants:
      JPMorgan Chase: {host: jpmc.fa.oraclecloud.com, site_number: CX_1001}
      Emerson: {host: hdjq.fa.us2.oraclecloud.com, site_number: CX_1}
      Honeywell: {host: ibqbjb.fa.ocs.oraclecloud.com, site_number: CX_1, careers_path_site: Honeywell}
      Oracle: {host: eeho.fa.us2.oraclecloud.com, site_number: CX_45001}
      Fortinet: {host: edel.fa.us2.oraclecloud.com, site_number: CX_2001}
    finding: >-
      Job Radar already places offset inside findReqs and fails closed on total
      movement, overlap, premature empty pages, and short pages. Sibling facet
      partitioning is safe only when every bucket is well formed, bounded,
      non-overlapping, and sums exactly to the anchor total; the checked-in
      evidence contains no such exact partition inventory for these five sites.
    immutable_snapshot_proven: false
  eightfold:
    result: no_safe_shared_fix
    pcsx_targets: [Microsoft, Qualcomm, Micron, Eaton, GlobalFoundries]
    finding: >-
      Stable position IDs and reported counts exist, but the stored runs show
      cross-page overlap/movement. jobseek's sitemap-first watermark flow and
      freehire's empty-page backstop do not prove that each exact sitemap or
      PCSX result is a complete current active inventory in Job Radar.
    authoritative_exact_sitemap_proven: false
  workday:
    result: not_applicable_to_batch2_production_targets
    targets: []
    migration_leads:
      Micron: https://micron.wd1.myworkdayjobs.com/external
      GlobalFoundries: https://globalfoundries.wd1.myworkdayjobs.com/External
    finding: >-
      Both are sibling-only migration leads. Existing Phase 4 Workday 2,000-cap
      subdivision, partition accounting, identity checks, and request budgets
      remain unchanged.
  meta_sitemap:
    result: insufficient_deterministic_evidence_for_candidate
    source: https://www.metacareers.com/jobsearch/sitemap.xml
    authority: first_party_lead
    stable_id_shape: /job_details/{numeric_id}
    blockers:
      - no checked-in Job Radar sitemap body or shard/index fixture
      - no proof that the sitemap is current active inventory rather than discovery inventory
      - detail failures must protect enumerated IDs instead of dropping them
      - hydration request budget cannot be derived without a fixture item count
  rivian_sitemap:
    result: insufficient_deterministic_evidence_for_candidate
    source: https://careers.rivian.com/sitemap.xml
    authority: first_party_lead
    blockers:
      - no checked-in exact sitemap/index body and shard count
      - no proof of active-only job membership or stale URL handling
      - no Job Radar stable-ID and hydration-accounting fixture
  goldman_graphql:
    result: insufficient_deterministic_evidence_for_candidate
    source: https://api-higher.gs.com/gateway/api/v1/graphql
    operation: GetRoles
    pagination: {style: page, page_number_start: 0, page_size: 20}
    variables:
      experiences: [EARLY_CAREER, PROFESSIONAL]
      search_term: ''
      filters: []
      sort: {sortStrategy: RELEVANCE, sortOrder: DESC}
    result_path: data.roleSearch.items
    total_path: data.roleSearch.totalCount
    stable_id: roleId
    canonical_url_template: https://higher.gs.com/roles/{roleId}
    public_unauthenticated: not_proven_by_job_radar_fixture
    blockers:
      - sibling board catalog is discovery evidence, not a response contract
      - no checked-in response fixture proving identity and total semantics
      - experience-union completeness and mutation behavior are untested

sibling_findings:
  jobseek:
    - {classification: ADAPT, file: apps/crawler/src/core/monitors/oracle_hcm.py, function: '_complete_facet_partition; discover_stream', mechanic: exact-sum bounded facet partitioning and finder offset, safeguard: reject configured overlap/shortfall/total tolerances as absence authority}
    - {classification: CONCEPT_ONLY, file: apps/crawler/src/core/monitors/eightfold.py, function: '_sitemap_urls; discover_stream', mechanic: sitemap inventory joined to PCSX IDs and watermark enrichment, safeguard: prove exact sitemap authority and fail the whole inventory on shard failure or truncation}
    - {classification: ADAPT, file: apps/crawler/src/core/monitors/sitemap.py, function: '_resolve_sitemap_index; discover', mechanic: bounded fail-whole child sitemap traversal, safeguard: MAX_URLS or any failed child must be incomplete}
    - {classification: REUSE_CONTRACT, file: apps/crawler/src/core/monitors/workday.py, function: '_paginate_query; _paginate_facet_union', mechanic: 2000-cap subdivision, safeguard: Job Radar identity and exact partition equations remain mandatory}
    - {classification: CONCEPT_ONLY, file: apps/crawler/data/boards.csv, function: board rows, mechanic: Meta/Rivian/Stantec sitemaps, Micron/GlobalFoundries Workday, Qualcomm sitemap, Goldman GraphQL leads, safeguard: catalog entries cannot activate production}
    - {classification: REJECT, file: apps/crawler/data/boards.csv, function: Oracle board metadata tolerances, mechanic: offset_overlap and count/shortfall tolerance, safeguard: arbitrary tolerance cannot prove a single snapshot}
  freehire:
    - {classification: REUSE_CONTRACT, file: internal/ingest/sources/oracle.go, function: listRequisitions, mechanic: offset inside Oracle finder, safeguard: empty page is not terminal below total and mutation must fail closed}
    - {classification: ADAPT, file: internal/ingest/sources/eightfold.go, function: pageList, mechanic: PCSX/v2 request and response shapes, safeguard: reject empty-page backstop, total drift, overlap, and partial detail drop as completeness}
    - {classification: CONCEPT_ONLY, file: internal/ingest/sources/workday.go, function: pageAll; splitByFacet, mechanic: 2000-cap facet recursion, safeguard: retain Job Radar identity, budget, duplicate, and partition accounting}
    - {classification: ADAPT, file: internal/ingest/sources/metacareers.go, function: Fetch; detail, mechanic: first-party sitemap and numeric job IDs, safeguard: protect failed detail identities instead of silently dropping them}
    - {classification: CONCEPT_ONLY, file: internal/ingest/sources/successfactors.go, function: Fetch; detail, mechanic: first-party job_sitemap.xml inventory, safeguard: prove exact tenant/scope and active-only semantics; account for every URL}
    - {classification: REJECT, file: internal/ingest/sources/smartrecruiters.go, function: listPostings, mechanic: arbitrary empty page as backstop, safeguard: authoritative total equality remains required}
  jobspy:
    - {classification: REJECT, file: jobspy/__init__.py, function: scrape_jobs, mechanic: third-party search pagination and aggregation, safeguard: no exact first-party identity or completeness authority for any Batch 2 target}

