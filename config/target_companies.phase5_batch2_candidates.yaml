  brassring:
    decision: DEFER
    reusable_targets_in_reference: 4
    reason: The mature reference contract proves IDs, totals, zero, pagination, and mutation handling, but employer ownership is not fail-closed and execution requires interactive browser behavior.
  tal_net:
    decision: DEFER
    reusable_targets_in_reference: 15
    reason: Stable /opp/ identities and broad reuse exist, but complete pagination, total, terminal, and zero semantics are not preserved.
  stantec_sitemap_model:
    decision: DEFER
    reusable_targets_in_reference: 316
    reason: A sitemap is useful positive discovery but is not inherently authoritative job inventory or removal evidence.
  coupang_cfs_protocol:
    decision: DEFER
    reusable_targets_in_reference: 1
    reason: Stable postingId exists, but the envelope has no preserved completeness/zero contract and does not fit existing fixed JSON variants.
  tupu360:
    decision: DEFER
    reusable_targets_in_reference: 2
    reason: Reusable stable detail identity exists, but authoritative listing pagination and zero remain unproven.

