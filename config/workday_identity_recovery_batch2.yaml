goal:
  name: workday_identity_recovery_batch2
  evidence_date: '2026-10-19'
  timezone: UTC
  baseline_branch: origin/main
  baseline_head: 8fd33b4
  production_registry_modified: false
  official_employer_pages_retrieved: true
  live_workday_inventory_requests_performed: false
  canary_performed: false
  production_data_accessed: false
  candidate_registry: config/target_companies.workday_identity_batch2_candidates.yaml
  migration_candidate_registry: config/target_companies.workday_identity_batch2_migration_candidates.yaml
  rollback_registry: config/target_companies.workday_identity_batch2_rollback.yaml
decision_rules:
- A first-party employer page must bind the exact Workday tenant, site, hostname, apply hostname, employer, and logical scope.
- A first-party full-search surface with consistent current Workday apply URLs can support a candidate contract.
- An individual posting alone does not prove the full recruiting board or its absence-authoritative scope.
- Existing default scope and tenant/site are preserved unless first-party evidence proves a genuine migration.
- READY_FOR_CANARY is not recovered; only a later explicitly authorized PASS_COMPLETE canary may support activation.
- No production lifecycle ownership or historical provider identity is inferred from repository configuration alone.
lifecycle_identity_audit:
  retained_active_or_historical_job_ids_in_checkout: 0
  supabase_or_other_production_store_queried: false
  reason: The task authorizes official careers-page retrieval and offline preparation, not a production audit.
  unchanged_scope_decision: The 16 straightforward candidates keep the same canonical company, default scope, tenant, and site, so no ownership reassignment is proposed.
  migration_decision: Sony and Shell remain isolated until exact source-owner counts and provider identity overlap/equivalence are reviewed read-only.
