      The current official listing, configuration endpoint, and result-list
      endpoint each returned HTTP 403 on both anonymous validation runs. The
      contract therefore does not meet the anonymous production guarantee, and
      no WAF, cookie, browser-session, or alternate-host bypass was attempted.
