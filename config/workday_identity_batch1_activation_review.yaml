unchanged_scope_common_assessment:
  exact_candidate_equivalence: >-
    Each proposal row is structurally identical to its row in the reviewed
    sixteen-company candidate registry.
  baseline_comparison: >-
    Each rollback row is structurally identical to its current production row.
    The proposal changes only fields enumerated above and preserves every other
    field from the tested candidate.
  employer_binding: >-
    workday_identity binds canonical employer, source scope, tenant, site,
    Workday hostname, apply hostname, official source, and binding target.
  stable_job_identity: >-
    The Workday adapter namespaces stable provider job IDs by workday tenant;
    these proposals retain each company's reviewed tenant and site.
  permitted_apply_hosts: >-
    Every expected_apply_hostname is present in allowed_apply_hosts.
  duplicate_and_scope_collision: >-
    The simulated production merge has one canonical company/default identity
    per company, introduces no sibling scope, and changes no unrelated row.
  lifecycle_effect: >-
    Because the logical default scope is retained, an authoritative complete
    persistent scan can reconcile existing ownership. A previously tracked job
    absent from the new complete inventory may advance from active to
    possibly_missing on the first qualifying absence and to removed on the
    second. Activation must therefore be controlled one company at a time, and
    the first lifecycle delta must be reviewed before another authoritative run.
  source_health_effect: >-
    Identity evidence changes the source/config fingerprint. New configuration
    health must start independently and must not inherit stale authority or
    cooldown state from the prior fingerprint.
  rollback: >-
    Restore only the named row from the activation rollback registry. This
    restores configuration and does not erase lifecycle history, retire a
    scope, or assert source health.

migration_audits:
  Adobe:
    classification: NEEDS_SCOPE_MIGRATION
    production_identity: {tenant: adobe, wd_subdomain: wd5, site_id: external_experienced, source_scope: default}
    candidate_identity: {tenant: adobe, wd_subdomain: wd5, site_id: external_experienced, source_scope: experienced}
    historical_default_owner_records: 332
    semantic_scope: >-
      The reviewed first-party evidence describes experienced roles and excludes
      Adobe university recruiting, so experienced is semantically accurate for
      this board.
    collision_and_lifecycle_risk: >-
      Production and candidate point to the same tenant/site but different
      logical scope keys. Replacing default with experienced would leave the 332
      default owners unretired; running both would create duplicate ownership of
      the same provider inventory. A new scope cannot silently close the old one.
    recommendation: >-
      Do not activate the experienced row yet. The least disruptive option is
      to preserve default and prepare a new exact default-scope candidate, which
      requires a separately authorized canary because it differs from the tested
      configuration. If the semantic rename is required, first export and
      reconcile exact provider_source_key values, then approve a dedicated
      ownership-migration and old-scope retirement plan with independent rollback.
    rollback: restore the original Adobe default row; never rewrite lifecycle history

  RBC:
    classification: NEEDS_SCOPE_MIGRATION
    production_identity: {tenant: rbc, wd_subdomain: wd3, site_id: RBCGLOBAL1, source_scope: default}
    candidate_identity: {tenant: rbc, wd_subdomain: wd3, site_id: RBCGLOBAL1, source_scope: global}
    historical_default_owner_records: 734
    semantic_scope: >-
      RBCGLOBAL1 and the reviewed first-party search surface support a global
      recruiting interpretation, but production already collected this exact
      tenant/site under default.
    collision_and_lifecycle_risk: >-
      Renaming the logical scope would strand 734 default ownership records;
      parallel default/global rows would duplicate ownership for exact provider
      IDs from the same board.
    recommendation: >-
      Preserve default unless an explicit semantic migration is approved. A
      default-scope identity candidate would need a new authorized canary because
      it is not the exact tested row. A global migration requires an exact
      provider-ID crosswalk, ownership counts, retirement approval, and a tested
      rollback plan before any persistent run.
    rollback: restore the original RBC default row; never rewrite lifecycle history

  CIBC:
    classification: BLOCKED_PENDING_EVIDENCE
    production_identity: {tenant: cibc, wd_subdomain: wd3, site_id: campus, source_scope: default}
    candidate_identity: {tenant: cibc, wd_subdomain: wd3, site_id: search, source_scope: default}
    historical_default_owner_records: 44
    semantic_scope: >-
      Existing evidence identifies campus as a distinct student/new-graduate
      board and search as the all-opportunities board. It does not prove that the
      latter contains the former.
    collision_and_lifecycle_risk: >-
      Replacing the site inside the same default scope changes the source
      fingerprint but leaves absence reconciliation scope-local. Campus IDs not
      returned by search could begin the two-complete-absence removal lifecycle.
      Provider ID stability and containment across sites have not been proven.
    required_evidence:
      - exact provider job ID sets for the retained campus inventory and validated search inventory
      - exact intersection, campus-only, search-only, and conflicting-ID counts
      - canonical and apply URL comparison for shared IDs
      - decision whether campus remains an independently authoritative recruiting scope
      - reviewed lifecycle handling for the 44 existing default owners
    recommendation: >-
      Do not replace campus with search. Prefer separately modeled campus and
      all-opportunities scopes only after exact cross-site evidence and a scope
      ownership migration plan exist. Any changed scope configuration requires
      its own explicitly authorized exact canary.
    rollback: restore the original campus/default row; never rewrite lifecycle history

activation_branch_execution:
  - Explicit approval covered the exact thirteen named proposal rows.
  - The untouched production rows first matched the exact rollback package; no baseline drift was present.
  - All thirteen rows were replaced with their exact tested proposals while every unrelated row remained unchanged.
  - Offline package, source-integrity, Workday, lifecycle, and full-suite regression verification was required before commit.
  - No deployment, live scan, workflow trigger, persistence, dashboard publication, or external mutation was performed.

remaining_deployment_procedure_not_executed:
  - Confirm scheduled and external writers are paused before merge.
  - Merge and deploy only under separate operational approval.
  - Run one controlled persistent synchronization only under separate operational approval.
  - Compare source ownership, lifecycle counts, missing counters, and duplicate keys before permitting a second authoritative run.
  - Re-enable the unchanged schedule only after the per-company observation is accepted.

proposed_rollback_procedure_not_executed:
  - Keep scheduled and external writers disabled.
  - Verify the active row is the exact approved proposal and the rollback row still matches the recorded baseline.
  - Replace only that company row with its exact rollback definition; do not retire a scope or edit lifecycle history.
  - Validate the registry, review the one-row diff, and deploy only under explicit approval.
  - Under separate approval, run one controlled recovery synchronization and verify ownership/lifecycle state before re-enabling writers.
