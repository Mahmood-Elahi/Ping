classification_rationale:
  B: >-
    Google returned a malformed careers contract, while ARM and Schneider
    Electric returned contradictory iCIMS count fields. Their existing adapter
    families remain conceptually valid; this is provider-contract work.
  C: >-
    The configured employer/board binding is stale or not exact. Browser,
    proxy, or authentication cannot safely manufacture employer identity.
  D: >-
    These sources returned inventory but did not prove an authoritative total,
    stable traversal, or terminal state. Existing adapters or source-specific
    contracts must supply the missing proof.
  E: >-
    The inventory was available but one or more rows could not be normalized.
    This is fail-closed parsing work, not an infrastructure dependency.
  F: >-
    The checked-in evidence is a one-snapshot HTTP or provider-side failure.
    It does not establish persistent network discrimination or a proxy need.
  I: >-
    GitHub returned an explicit blocked iCIMS response after partial progress;
    Parkland returned a Cloudflare-associated HTTP 403. These are the only
    credible network-block candidates, but one snapshot per source does not
    establish that alternate egress is effective or correct.
  L: >-
    A concrete source family or API exists, but Job Radar lacks the reviewed
    adapter variant/contract. This is new adapter coverage, not shared external
    infrastructure.

