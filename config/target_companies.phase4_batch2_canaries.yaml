# Opt-in only. Normal runtime does not load this file.
# Budgets cover at most one whole-traversal restart. HTML: 2 attempts per page
# x 2 traversals. Columnized: 2 identity attempts + listing POSTs + 2 detail
# attempts per expected job, x 2 traversals.
target_companies:
  - name: Gibson Energy
    platform: sap_successfactors
    careers_url: https://www.gibsonenergy.com/careers/
    search_url: https://careers.gibsonenergy.com/search/
    endpoint_variant: rmk_table
    identity_regex: Gibson Energy Jobs|Gibson Energy
    max_pages: 1
    max_jobs: 20
    protocol_request_budget: 4
