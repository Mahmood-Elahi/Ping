shared_repairs:
  implemented: []
  rejected:
    - family: oracle_recruiting
      affects: [JPMorgan Chase, Emerson, Honeywell]
      proposal: Accept overlap or one-row total/page shortfall tolerances.
      reason: Mutation would be reclassified as a clean terminal and could authorize false absence.
    - family: eightfold_pcsx
      affects: [Microsoft, Qualcomm, Micron, Eaton]
      proposal: Treat incremental watermarks or repeated/overlapping pages as complete.
      reason: Incremental discovery is positive-only and cannot authorize absence.
    - family: workday_wday_cxs_v1
      affects: [Samsung Electronics, GE Vernova, Capital One]
      proposal: Activate Phase 4 partitioning without exact workday_identity evidence.
      reason: Pagination mechanics cannot establish employer/site identity.
    - family: static_html
      affects: [General Motors, Caterpillar, Coupang, Zalando]
      proposal: Auto-follow generic next links or infer EOF from a short page.
      reason: Static HTML requires a reviewed continuation and terminal contract per source.

