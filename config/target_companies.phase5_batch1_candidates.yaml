pinpoint_decision:
  decision: NOT_WORTH_IT
  reference_board_count: 99
  canonical_target_matches: 0
  protocol_evidence: jobseek implements GET https://{slug}.pinpointhq.com/postings.json as one complete rich collection with URL-backed stable posting identities.
  identity_evidence: Employer identity can be bound to the exact subdomain plus the native careers-page title, but no Job Radar target currently needs it.
  rationale: The deterministic contract is strong, but a new adapter would add no identified Batch 1 target coverage.

