playbook_rules_reused:
  - exact employer and provider identity precedes completeness
  - only complete authoritative inventory may reconcile absence
  - partial positives never authorize missing or closure transitions
  - request and result limits are not terminal evidence
  - repeated pages, repeated cursors, overlap, and total movement fail closed
  - stable unreadable provider identities remain protected
  - inventory enumeration is separate from detail hydration and normalization
  - alternate ATS migration requires exact source-scope equivalence
  - third-party aggregators and retention are never absence authority

