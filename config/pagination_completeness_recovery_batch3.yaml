  silent_loss_allowed: false
  required_diagnostics: [raw_items, unique_provider_ids, normalized_jobs, unreadables, rejections, duplicate_ids, duplicate_urls, canonical_urls]

mutation_contract:
  triggers: [total_change, page_shift, inserted_record_before_offset, removed_record_before_offset, duplicate_boundary_record, cursor_or_page_repetition, partition_overlap, changing_partition_total]
  outcome: {positive_discoveries_retained: true, scan_complete: false, absence_authorized: false}
  overlap_tolerance_authoritative: false

