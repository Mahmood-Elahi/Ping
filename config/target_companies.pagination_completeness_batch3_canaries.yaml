# Explicit opt-in Batch 3 canary. Normal Job Radar execution loads
# config/target_companies.yaml and cannot load this file implicitly.
# This candidate does not change Bosch's production source limits.
target_companies:
  - name: Bosch
    platform: smartrecruiters
    slug: BoschGroup
    endpoint_variant: companies_postings_v1
    careers_url: https://jobs.bosch.com/en/
    endpoint_url: https://api.smartrecruiters.com/v1/companies/BoschGroup/postings
    identity_regex: ^Bosch Group$
    allowed_apply_hosts: [jobs.smartrecruiters.com]
    page_size: 100
    max_pages: 50
    max_jobs: 5000
    max_response_bytes: 3000000
    selective_detail_enrichment: false
