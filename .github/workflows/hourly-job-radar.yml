name: Hourly Job Radar

on:
  schedule:
    # GitHub Actions cron schedules use UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: job-radar-hourly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-student-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Scan the checked-out tree for credentials
        run: python scripts/check_public_release_secrets.py

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Prepare production credentials
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          set -euo pipefail

          missing=0
          [[ -n "${SUPABASE_URL:-}" ]] || missing=1
          [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || missing=1
          [[ -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]] || missing=1
          [[ -n "${GOOGLE_SHEET_ID:-}" ]] || missing=1

          if (( missing )); then
            printf '::error::Required production GitHub Secrets are missing.\n' >&2
            exit 1
          fi

          credentials_path="${RUNNER_TEMP}/google-service-account.json"
          umask 077
          printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > "${credentials_path}"
          if [[ ! -s "${credentials_path}" ]]; then
            printf '::error::Failed to create the Google credentials file under RUNNER_TEMP.\n' >&2
            exit 1
          fi
          printf 'GOOGLE_CREDENTIALS_PATH=%s\n' "${credentials_path}" >> "${GITHUB_ENV}"

      - name: Preflight production configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: >-
          python scripts/run_public_ci_step.py
          --stage production-preflight
          -- python scripts/validate_production_ci_preflight.py

      - name: Update student dashboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: >-
          python scripts/run_public_ci_step.py
          --stage dashboard-update
          -- python scripts/update_student_dashboard.py

      - name: Remove temporary private files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/google-service-account.json"
          rm -f "${RUNNER_TEMP}/ping-private-ci/production-preflight.log"
          rm -f "${RUNNER_TEMP}/ping-private-ci/dashboard-update.log"
          rm -f "${RUNNER_TEMP}/ping-private-ci/production-preflight.report.jsonl"
          rm -f "${RUNNER_TEMP}/ping-private-ci/dashboard-update.report.jsonl"
          rmdir "${RUNNER_TEMP}/ping-private-ci" 2>/dev/null || true
