<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RoleRadar social preview</title>
  <desc id="desc">Social preview graphic for RoleRadar, a target-company job discovery tool with source coverage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081118"/>
      <stop offset="0.55" stop-color="#101820"/>
      <stop offset="1" stop-color="#162B36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(944 188) rotate(132) scale(420 300)">
      <stop stop-color="#32D6C4" stop-opacity="0.36"/>
      <stop offset="0.52" stop-color="#4B7CFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="900" y1="116" x2="1124" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D6C4"/>
      <stop offset="1" stop-color="#4B7CFF"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#D6F7F2" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

