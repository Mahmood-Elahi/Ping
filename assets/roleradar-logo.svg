<svg width="960" height="240" viewBox="0 0 960 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ping logo</title>
  <desc id="desc">Ping wordmark with a radar scan mark.</desc>
  <defs>
    <linearGradient id="scan" x1="95" y1="34" x2="190" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D6C4"/>
      <stop offset="1" stop-color="#4B7CFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="90" y1="70" x2="170" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F4A62A"/>
    </linearGradient>
    <filter id="softShadow" x="8" y="8" width="244" height="224" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0B1820" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="48" y="32" width="176" height="176" rx="40" fill="#101820"/>
    <path d="M136 120L198 62C216 86 224 118 217 150L136 120Z" fill="url(#scan)" fill-opacity="0.9"/>
    <circle cx="136" cy="120" r="73" stroke="#D6F7F2" stroke-opacity="0.32" stroke-width="6"/>
    <circle cx="136" cy="120" r="48" stroke="#D6F7F2" stroke-opacity="0.42" stroke-width="5"/>
    <circle cx="136" cy="120" r="21" stroke="#D6F7F2" stroke-opacity="0.52" stroke-width="4"/>
    <path d="M136 120L195 73" stroke="#66F0DE" stroke-width="7" stroke-linecap="round"/>
    <circle cx="136" cy="120" r="8" fill="url(#gold)"/>
    <circle cx="177" cy="86" r="7" fill="#FFE08A"/>
    <circle cx="92" cy="144" r="6" fill="#32D6C4"/>
    <circle cx="165" cy="168" r="5" fill="#4B7CFF"/>
  </g>

  <text x="280" y="117" fill="#101820" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">
    Ping
  </text>
  <text x="284" y="158" fill="#52616B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" letter-spacing="0.7">
    New roles. Less noise.
  </text>
  <path d="M284 184H650" stroke="#32D6C4" stroke-width="5" stroke-linecap="round"/>
  <path d="M668 184H734" stroke="#F4A62A" stroke-width="5" stroke-linecap="round"/>
</svg>
